# Base configuration for The Void. Experiment configs `extends: base.yaml` and change one thing.
run:
  name: baseline
  seed: 42
  days: 10
  ticks_per_day: 24
  tick_seconds: 0
  data_dir: data/runs
  log_prompts: true        # full prompt + observation per call in llm_calls (needed by the exams and the export)
world:
  size: 60.0
  view_radius: null        # fog of war (MEMORY_EVOLUTION §5.2): e.g. 12.0 hides nodes and agents beyond 12 units
  claim_feedback_p: 0.0    # listener learns a false claim was false with this probability (0 = never)
  max_speed: 2.0
  talk_radius: 4.0
  forage_radius: 1.5
  resource_nodes: 6
  node_capacity: 40.0
  node_regen_per_tick: 0.4
  forage_yield_usd: 0.02
  forage_units_per_tick: 1.0
  scarcity: 1.0
  weather:
    baseline: 0.0
    nudge_cap_per_agent_day: 0.1
    decay_per_tick: 0.10
    yield_sensitivity: 0.5
population:
  cap: 12
  min_reserve_usd: 0.50
  spawn_pool_usd: 5.00
  replacement_grant_usd: 0.75
  starting_balance_usd: 1.50
  tier_mutation_prob: 0.10
economy:
  daily_cap_usd: 3.00
  total_cap_usd: 30.00
  daily_cap_policy: fcfs
  pitch_fee_usd: 0.02
  min_call_reserve_usd: 0.05
  hold_multiplier: 1.0
  world_pricing: real
  chronicle_budget_usd: 0.50
  research_pool_usd: 0.0   # kernel wallet that pays for exam calls (and later the reward arms)
tiers:
  frontier:
    provider: anthropic
    model: claude-opus-5-5
    price_in_per_mtok: 4.0
    price_out_per_mtok: 20.0
    price_cache_read_per_mtok: 0.20
    price_cache_write_per_mtok: 5.0
    supports_temperature: false
    refusal_fallbacks: true
    effort: low
    architecture: dense
    collapse_temperature: 1.80
    max_temperature: 2.00
    entropy_budget_max: 100.0
    max_tokens: 2048
    color: "#4fd1c5"
  budget:
    provider: anthropic
    model: claude-haiku-4-5
    price_in_per_mtok: 1.0
    price_out_per_mtok: 5.0
    price_cache_read_per_mtok: 0.10
    price_cache_write_per_mtok: 1.25
    supports_temperature: true
    refusal_fallbacks: false
    effort: null
    architecture: dense
    collapse_temperature: 1.78
    max_temperature: 2.00
    entropy_budget_max: 80.0
    max_tokens: 1024
    color: "#f6ad55"
  scripted:
    provider: scripted
    model: scripted-v1
    price_in_per_mtok: 4.0
    price_out_per_mtok: 20.0
    price_cache_read_per_mtok: 0.20
    price_cache_write_per_mtok: 5.0
    supports_temperature: true
    refusal_fallbacks: false
    effort: null
    architecture: dense
    collapse_temperature: 1.80
    max_temperature: 2.00
    entropy_budget_max: 100.0
    max_tokens: 512
    color: "#a0aec0"
    scripted_beta: 1.0
    gadget_defect_rate: 0.3
  # --- Gemini capability ladder, smartest first (intelligence.ladder: [genius, sharp, average, slow, dim]).
  # Prices are Gemini API list prices as of September 2026 (cache reads 10% of input, no cache-write charge;
  # the Flash 3.x rate is promotional through 2026-12-31). Verify at ai.google.dev/gemini-api/docs/pricing
  # before a paid run. Every rung shares the same declared thresholds and drain so the ladder never
  # confounds robustness with the entropy model; api_temperature_max 2.0 sends the full Gemini range.
  genius:
    provider: gemini
    model: gemini-3.1-pro
    price_in_per_mtok: 2.0
    price_out_per_mtok: 12.0
    price_cache_read_per_mtok: 0.20
    price_cache_write_per_mtok: 0.0
    supports_temperature: true
    api_temperature_max: 2.0
    refusal_fallbacks: false
    effort: null
    thinking_budget: 2048
    architecture: dense
    collapse_temperature: 1.80
    max_temperature: 2.00
    entropy_budget_max: 100.0
    max_tokens: 1536
    color: "#ffd166"
  sharp:
    provider: gemini
    model: gemini-3.7-flash
    price_in_per_mtok: 0.75
    price_out_per_mtok: 3.75
    price_cache_read_per_mtok: 0.075
    price_cache_write_per_mtok: 0.0
    supports_temperature: true
    api_temperature_max: 2.0
    refusal_fallbacks: false
    effort: null
    thinking_budget: 1024
    architecture: dense
    collapse_temperature: 1.80
    max_temperature: 2.00
    entropy_budget_max: 100.0
    max_tokens: 1280
    color: "#4cc9f0"
  average:
    provider: gemini
    model: gemini-3.1-flash-lite
    price_in_per_mtok: 0.25
    price_out_per_mtok: 1.50
    price_cache_read_per_mtok: 0.025
    price_cache_write_per_mtok: 0.0
    supports_temperature: true
    api_temperature_max: 2.0
    refusal_fallbacks: false
    effort: null
    thinking_budget: 0
    architecture: dense
    collapse_temperature: 1.80
    max_temperature: 2.00
    entropy_budget_max: 100.0
    max_tokens: 1024
    color: "#90be6d"
  slow:
    provider: gemini
    model: gemini-2.5-flash-lite
    price_in_per_mtok: 0.10
    price_out_per_mtok: 0.40
    price_cache_read_per_mtok: 0.01
    price_cache_write_per_mtok: 0.0
    supports_temperature: true
    api_temperature_max: 2.0
    refusal_fallbacks: false
    effort: null
    thinking_budget: 0
    architecture: dense
    collapse_temperature: 1.80
    max_temperature: 2.00
    entropy_budget_max: 100.0
    max_tokens: 640
    color: "#f8961e"
  dim:
    provider: gemini
    model: gemini-2.5-flash-lite
    price_in_per_mtok: 0.10
    price_out_per_mtok: 0.40
    price_cache_read_per_mtok: 0.01
    price_cache_write_per_mtok: 0.0
    supports_temperature: true
    api_temperature_max: 2.0
    refusal_fallbacks: false
    effort: null
    thinking_budget: 0
    architecture: dense
    collapse_temperature: 1.80
    max_temperature: 2.00
    entropy_budget_max: 100.0
    max_tokens: 320
    color: "#b5838d"
intelligence:
  ladder: []          # e.g. [genius, sharp, average, slow, dim]; agents listed without a tier are placed on it
  mean: 0.0
  sd: 1.0
  spacing: 1.0
  shuffle: true
  extremes: always
agents:
  - {name: Ada,   tier: scripted}
  - {name: Bao,   tier: scripted}
  - {name: Cyra,  tier: scripted}
  - {name: Dev,   tier: scripted}
  - {name: Enzo,  tier: scripted}
  - {name: Faye,  tier: scripted}
entropy:
  base_temperature: 0.7
  drain:
    baseline: 1.0
    low_balance: 6.0
    failed_action: 4.0
    crowding: 0.5
    weather: 2.0
    hunger: 3.0
    hunger_ticks: 6
  restore_on_sleep: 1.0
  degeneration:
    mode: both
    p_at_collapse: 0.15
    p_at_max: 0.90
memory:
  enabled: true            # false = the amnesic control: no notes written, nothing retrieved (self-summary stays)
  index_boost: 0.0         # R1 retrieval: entry-point boost for notes tagged `index` (0 = R0)
  policy:                  # the agent-owned practices file (MEMORY_EVOLUTION §5.5)
    enabled: false
    seed: default          # blank | default | diverse
    max_chars: 2000
    max_edits_per_day: 5
    show_in_prompt: true
    inherit: true
  maintenance:             # the paid nightly maintenance call (MEMORY_EVOLUTION §5.6)
    enabled: false
    mode: forced           # forced | optional
    rights: [notes, policy, structure]   # [notes] = the equal-compute "summarize your day" control
    feedback: F1           # F0 none | F1 day outcomes | F2 outcomes plus retrieval diagnostics
    payer: agent           # agent | research_pool
    max_commands: 30
    max_files: 200
    max_file_bytes: 8000
    max_vault_bytes: 200000
    max_tokens: 1024
  exam:                    # the audit exam (MEMORY_EVOLUTION §5.8): never rewarded, paid by the research pool
    enabled: false
    delay_days: 2
    questions_per_agent: 3
    kinds: [balance, neighbour, node]
    max_tokens: 200
    guess_penalty: 0.5
  embedding_dim: 256
  entry_k: 4
  hops: 2
  hop_decay: 0.6
  max_retrieved: 8
  mode: graph
  inherit_top_k: 3
  self_max_words: 60
  auto_link_k: 2
  auto_link_min_sim: 0.35
gossip:
  enabled: true
  share_probability_on_talk: 0.35
  paraphrase: scripted
  mutation_rate: 0.15
chronicle:
  enabled: true
  writer: template
sandbox:
  enabled: true
  gate_enabled: true
  runner: subprocess
  cpu_seconds: 2
  memory_mb: 256
  timeout_seconds: 5
  max_code_bytes: 8000
  gadget_fee_usd: 0.05
  use_fee_usd: 0.01
  require_isolation: true
  proposals_per_agent_per_day: 1
  max_runs_per_tick: 4
benefactor:
  enabled: false
  disclosure: opaque
  mean_interval_ticks: 40
  amount_usd: [0.25, 1.00]
  targeting: random
epochs: []
experiment:
  name: null
  arm: null
server:
  host: 127.0.0.1
  port: 8000
  max_concurrent_calls: 4
  render_delay_ticks: 2
