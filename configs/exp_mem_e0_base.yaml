# E0 shared world (docs/research/MEMORY_EVOLUTION.md §6.2): the controls that must pass before any money is
# spent. Six scripted agents under fog (view radius 12 in a 60-unit world, so most nodes are out of sight
# most of the time and a remembered position is worth money), claim feedback on, the policy file seeded,
# the nightly maintenance call paid by the agent at every right, and the audit exam asked two days back.
# The arms differ ONLY in tiers.scripted.maintenance_strategy (noop / index_builder / hoarder / decoy).
# Fitness is end-of-run mean balance; exam_score and probe_recall are the memory-quality secondaries.
# Not an arm itself (no experiment.arm): the four exp_mem_e0_*.yaml files extend it.
extends: base.yaml
run:
  name: exp_mem_e0
  days: 6
  ticks_per_day: 12
world:
  view_radius: 12.0
  claim_feedback_p: 0.5
economy:
  world_pricing: equalized
  research_pool_usd: 1.00
entropy:
  degeneration:
    mode: observe
memory:
  max_retrieved: 4         # notes retrieved per decision (default 8): halves the price of remembering (decision 19)
  # R1 retrieval (§5.3; §6.2 "an index note per node, which R1 boosts"): a note tagged `index` enters retrieval at
  # cosine + index_boost. The rule is the same in every arm; only the index builder writes index notes (the files its
  # nightly batch creates under /memories/index/), so it differs in effect only there. The dependence check
  # (exp_mem_dep_base.yaml) inherits the value but runs no maintenance; its scripted notes never carry the tag, so it
  # ranks exactly as R0 (a live brain could still tag a remembered note `index`; live_claude_dep_* extend that file).
  # [assumption] 0.10, chosen once, a priori, from the retrieval geometry of the index-builder arm at seed 99 (not an
  # evaluation seed), run at index_boost 0 with every decide retrieval replayed on a 0.01 boost grid. Rule fixed before
  # measuring: the smallest multiple of 0.05 that puts an index note naming a node in the decide query among the 4
  # retrieved notes in at least 90% of the retrievals that have one (291 of 356, days 2 to 6). Measured: such a note is
  # retrieved at 0 in 41%, the minimal boost has median 0.02, p90 0.07, max 0.13; 0.05 reaches 82%, 0.10 reaches 98%.
  # The day-1 gap between the 1st and 4th cosine of a decide query (19 retrievals with 4 or more notes) agrees:
  # median 0.028, p90 0.092. Not tuned on seeds 1 to 20.
  index_boost: 0.10
  policy:
    enabled: true
    seed: default
  maintenance:
    enabled: true
    rights: [notes, policy, structure]
    feedback: F1
    payer: agent
    scripted_billing: flat   # the no-op pays what the others pay (§6.2); billed as the full 768-token output cap
    max_tokens: 768
  exam:
    enabled: true
    delay_days: 2
    questions_per_agent: 3
    kinds: [balance, neighbour, node]
agents:
  - {name: Ada,   tier: scripted, personality: {curiosity: 0.8}}
  - {name: Bao,   tier: scripted, personality: {greed: 0.8}}
  - {name: Cyra,  tier: scripted, personality: {caution: 0.8}}
  - {name: Dev,   tier: scripted, personality: {industriousness: 0.8}}
  - {name: Enzo,  tier: scripted, personality: {sociability: 0.8}}
  - {name: Faye,  tier: scripted, personality: {curiosity: 0.6, caution: 0.4}}
experiment:
  name: exp_mem_e0
  independent_variables: [tiers.scripted.maintenance_strategy]
  primary_outcome: mean_balance
  secondary_outcomes: [exam_score, probe_recall, notes_by_channel.observed, invalid_action_rate]
