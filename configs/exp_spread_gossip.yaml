# exp_spread, arm gossip: the tracer note can spread only by gossip (gossip on, reproduction off).
# The three arms (gossip / inherit / both) toggle gossip.enabled and population.reproduction_enabled
# and nothing else. A tracer note is planted in Ada's vault on day 1.
# Primary `time_to_50pct_tracer_reach_censored` (DESIGN §17's time to 50% tracer reach): the first tick whose row has
# tracer_reach / population >= 0.5. A run that never gets there is right censored: it scores the run's last tick + 1
# (49 here, 4 days x 12 ticks + 1), a lower bound on the tick it would have got there, where the uncensored
# `time_to_50pct_tracer_reach` gives None and compare drops the pair. So every seed is compared: a seed censored in
# both arms is a tie, and an arm that never spreads counts as reaching half just after the end, which understates
# its delay rather than inventing one. `tracer_reach_censored` (1.0 for a censored run) gives each arm's censored
# share; on seeds 1-6, 2 of 6 gossip runs, 6 of 6 inherit runs and 4 of 6 both runs were censored.
# Secondaries: `tracer_adopters` (DESIGN §17's other headline), `tracer_reach` (alive agents holding a descendant of
# the tracer note, last tick row), `tracer_reach_censored`, `gossip_transfers`. See void/research/outcomes/spread.py.
# Starting balance $1.30 (base $1.50), the same in every arm: under the scripted offspring rule (DESIGN §7.2,
# 2 x min_reserve + endowment = $1.20) each founder can afford one child at once, so the six places under the cap
# go one per founder rather than to whoever reproduces twice first. The tracer holder then has a child in most
# seeds, without which inheritance cannot carry the note at all.
# VoidConfig.warnings() is empty for this config.
extends: base.yaml
run:
  name: exp_spread_gossip
  days: 4
  ticks_per_day: 12
population:
  starting_balance_usd: 1.30
  reproduction_enabled: false
entropy:
  degeneration:
    mode: observe
gossip:
  enabled: true
experiment:
  name: exp_spread
  arm: gossip
  independent_variables: [gossip.enabled, population.reproduction_enabled]
  primary_outcome: time_to_50pct_tracer_reach_censored
  secondary_outcomes: [tracer_adopters, tracer_reach, tracer_reach_censored, gossip_transfers]
  tracer:
    enabled: true
    day: 1
    agent: Ada
