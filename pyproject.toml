[project]
name = "void"
version = "0.1.0"
description = "The Void: an autonomous multi-agent LLM ecology with a real economy, graph memory, sandboxed gadgets, culture, and generational selection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.80",
  "google-genai>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "websockets>=12",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
figures = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "hypothesis>=6.100",
]

[project.scripts]
void = "void.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["void"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
